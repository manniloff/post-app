apiVersion: apps/v1
kind: Deployment
metadata:
  name: post-app
  namespace: post-app
  labels:
    app: post-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: post-app
  template:
    metadata:
      labels:
        app: post-app
    spec:
      imagePullSecrets:
        - name: acr-pull-secret   # ниже создадим этот secret
      containers:
        - name: post-app
          # PLACEHOLDER: image will be replaced by CI (see steps)
          image: .azurecr.io/myapp:4bdd6f2b75b6ec4581d260d396d847b404a9af94
          ports:
            - containerPort: 8888
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 30
            periodSeconds: 20
