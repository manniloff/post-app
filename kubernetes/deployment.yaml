apiVersion: apps/v1
kind: Deployment
metadata:
  name: post-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: post-app
  template:
    metadata:
      labels:
        app: post-app
    spec:
      containers:
        - name: post-app
          image: your-dockerhub-username/post-app:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: post-app-config
