version: 2.1

orbs:
  azure-acr: circleci/azure-acr@0.2.0
  docker: circleci/docker@2.1.2
  azure-aks: circleci/azure-aks@0.3.0
  azure-cli: circleci/azure-cli@1.2.2
  helm: circleci/helm@2.0.0

executors:
  posts-executor:
    environment:
      CONTAINER_IMAGE_NAME: posts/posts
    docker:
      - image: cimg/openjdk:8.0
      - image: cimg/base:2022.09

jobs:
  build:
    executor: posts-executor
    docker:
      - image: maven:3.8.1-jdk-11
      - image: circleci/mysql
      - image: docker:20.10.24

    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - restore_cache:
          key: jars-{{ checksum "pom.xml" }}

      - run: mvn dependency:go-offline

      - save_cache:
          paths:
            - ~/.m2
          key: jars-{{ checksum "pom.xml" }}

      - attach_workspace:
          at: .

      - run:
          name: Generate Version
          command: |
            VERSION="1.0.$(git rev-list --count HEAD)"
            echo "Generated version: $VERSION"

      # Build and test the project
      - run:
          name: Build
          command: mvn clean install

      - persist_to_workspace:
          root: .
          paths:
            - target

      - store_artifacts:
          path: ./target

  test:
    executor: posts-executor
    docker:
      - image: maven:3.8.1-jdk-11
      - image: circleci/mysql

    steps:
      - checkout
      - restore_cache:
          key: jars-{{ checksum "pom.xml" }}
      - run:
          name: Test
          command: mvn test
      - save_cache:
          paths:
            - ~/.m2
          key: jars-{{ checksum "pom.xml" }}

      - store_artifacts:
          path: target/surefire-reports
      - store_test_results:
          path: target/surefire-reports

  artefact-delivery:
    executor: posts-executor
    docker:
      - image: cimg/base:stable

    steps:
      - checkout

      - attach_workspace:
          at: .

      - add_ssh_keys:
          fingerprints:
            - "SHA256:bdQhUpWvsTenmxgrI/Z4u49QPvaTPhHqZk0SZpzUuQE"
      - run:
          name: Install SSH Client
          command: sudo apt-get update && sudo apt-get install -y openssh-client

      - run:
          name: SSH connection and deploy .war file
          command: |
            scp -v -o StrictHostKeyChecking=no target/post-app.war $SSH_USER@$SSH_HOST:/opt/docker-version/post-app.war
          no_output_timeout: 20m

      - run:
          name: SSH connection and deploy Dockerfile
          command: |
            scp -v -o StrictHostKeyChecking=no docker/Dockerfile $SSH_USER@$SSH_HOST:/opt/docker-version/Dockerfile
          no_output_timeout: 20m

      - run:
          name: SSH connection and deploy docker-compose
          command: |
            scp -v -o StrictHostKeyChecking=no docker/docker-compose.yml $SSH_USER@$SSH_HOST:/opt/docker-version/docker-compose.yml
          no_output_timeout: 20m

  artefact-deploy:
    executor: posts-executor
    docker:
      - image: cimg/base:stable

    steps:
      - checkout

      - attach_workspace:
          at: .

      - run:
          name: Build and Run Docker on Server
          command: |
            ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST "
              cd /opt/docker-version &&
              docker build -t post-app:latest . &&
              docker-compose down &&
              docker-compose up -d
            "
  notify:
    executor: posts-executor
    docker:
      - image: circleci/python:3.8
      - image: cimg/base:stable
    steps:
      - run:
          name: Send Notification to Telegram
          command: |
            STATUS="$CIRCLE_JOB_STATUS"
            PROJECT="$CIRCLE_PROJECT_REPONAME"
            BRANCH="$CIRCLE_BRANCH"
            USERNAME="$CIRCLE_USERNAME"
            BUILD_NUMBER="$CIRCLE_BUILD_NUM"
            BUILD_URL="$CIRCLE_BUILD_URL"
            WORKFLOW_ID="$CIRCLE_WORKFLOW_ID"
            
            # Get workflow jobs using CircleCI API
            JOBS=$(curl -s -u "${CIRCLECI_API_TOKEN}:" \
              "https://circleci.com/api/v2/workflow/${WORKFLOW_ID}/job")
            
            # Extract job statuses using jq
            TEST_JOB_STATUS=$(echo "$JOBS" | jq -r '.items[] | select(.name=="test") | .status')
            BUILD_JOB_STATUS=$(echo "$JOBS" | jq -r '.items[] | select(.name=="build") | .status')
            DELIVERY_JOB_STATUS=$(echo "$JOBS" | jq -r '.items[] | select(.name=="artefact-delivery") | .status')
            DEPLOY_JOB_STATUS=$(echo "$JOBS" | jq -r '.items[] | select(.name=="artefact-deploy") | .status')
            
            # Determine workflow status
            if [[ "$TEST_JOB_STATUS" == "success" && \
                  "$BUILD_JOB_STATUS" == "success" && \
                  "$DELIVERY_JOB_STATUS" == "success" && \
                  "$DEPLOY_JOB_STATUS" == "success" ]]; then
              WORKFLOW_STATUS="✅ Success"
            else
              WORKFLOW_STATUS="❌ Failed"
            fi
            
            # Construct the message
            MESSAGE="*Project:* $PROJECT\n*Branch:* $BRANCH\n*Build Number:* $BUILD_NUMBER\n*Build URL:* $BUILD_URL\n*Workflow Status:* $WORKFLOW_STATUS\n\n*Jobs:*\n- *test:* $TEST_JOB_STATUS\n- *build:* $BUILD_JOB_STATUS\n- *artefact_delivery:* $DELIVERY_JOB_STATUS\n- *artefact_deploy:* $DEPLOY_JOB_STATUS"
            
            
                     # Send the message to Telegram
                     BOT_TOKEN="8160426392:AAH0U-rES-lEvecTZopoaeKKFsB9iF_3OJ8"
                     CHAT_ID="845733750"
                     curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
                     -d chat_id="${CHAT_ID}" \
                     -d text="${MESSAGE}" \
                     -d parse_mode="Markdown"


workflows:
  version: 2
  build_test_deploy:
    jobs:
      - build
      - test
      - artefact-delivery:
# Ignore deployment if versioning for app didn't present
#          filters:
#            tags:
#              only: /^v.*/
#            branches:
#              ignore: /.*/
          requires:
            - build
            - test
      - artefact-deploy:
          requires:
            - artefact-delivery
      - notify:
          requires:
            - test
            - build
            - artefact-delivery
            - artefact-deploy

