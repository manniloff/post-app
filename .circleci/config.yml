version: 2.1

orbs:
    azure-acr: circleci/azure-acr@0.2.0
    docker: circleci/docker@2.1.2
    azure-aks: circleci/azure-aks@0.3.0
    azure-cli: circleci/azure-cli@1.2.2
    helm: circleci/helm@2.0.0

executors:
  posts-executor:
    environment:
      CONTAINER_IMAGE_NAME: posts/posts
    docker:
      - image: cimg/openjdk:8.0

jobs:
  build:
    docker:
      - image: maven:3.8.1-jdk-11
      - image: circleci/mysql

    steps:
      - checkout
      - restore_cache:
          key: jars-{{ checksum "pom.xml" }}

      - run: mvn dependency:go-offline

      - save_cache:
          paths:
            - ~/.m2
          key: jars-{{ checksum "pom.xml" }}

      - attach_workspace:
          at: ./workspace

      # Build and test the project
      - run:
          name: Build
          command: mvn clean install

      - persist_to_workspace:
          root: ./
          paths:
            - ./target/build

      - store_artifacts:
          path: ./target/build
  test:
    docker:
      - image: maven:3.8.1-jdk-11
      - image: circleci/mysql

    steps:
      - checkout
      - restore_cache:
          key: jars-{{ checksum "pom.xml" }}
      - run:
          name: Test
          command: mvn test
      - save_cache:
          paths:
            - ~/.m2
          key: jars-{{ checksum "pom.xml" }}

      - store_artifacts:
          path: target/surefire-reports
      - store_test_results:
          path: target/surefire-reports

  deploy:
    docker:
      - image: maven:3.8.1-jdk-11
      - image: circleci/mysql

    steps:
      - checkout
      - run:
          name: Create SSH directory and known_hosts file
          command: |
            mkdir -p ~/.ssh && touch ~/.ssh/known_hosts

      - run:
          name: Add Host Key to known_hosts
          command: |
            echo "195.26.255.172 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBE0z6IbZGhRmiySG0Ih22t7rZZcgQK1iR6OTK8rd5cWE3mFEC5JcE2RVwI7q/xymBEyIz9ON/Bly/Sb0KHzZ3dI=" >> ~/.ssh/known_hosts

      - run:
          name: Deploy
          command: |
            ssh root@195.26.255.172 "mkdir -p /var/lib/tomcat9/webapps"
            scp /target/build/docker-post-app.war root@195.26.255.172:/var/lib/tomcat9/webapps

workflows:
  version: 2
  build_test_deploy:
    jobs:
      - build
      - test
      - deploy:
          requires:
            - build
            - test