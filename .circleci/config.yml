version: 2.1

orbs:
  azure-acr: circleci/azure-acr@0.2.0
  docker: circleci/docker@2.1.2
  azure-aks: circleci/azure-aks@0.3.0
  azure-cli: circleci/azure-cli@1.2.2
  helm: circleci/helm@2.0.0

executors:
  posts-executor:
    environment:
      CONTAINER_IMAGE_NAME: posts/posts
    docker:
      - image: cimg/openjdk:8.0
      - image: cimg/base:2022.09

jobs:
  build:
    executor: posts-executor
    docker:
      - image: maven:3.8.1-jdk-11
      - image: circleci/mysql
      - image: docker:20.10.24

    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - restore_cache:
          key: jars-{{ checksum "pom.xml" }}

      - run: mvn dependency:go-offline

      - save_cache:
          paths:
            - ~/.m2
          key: jars-{{ checksum "pom.xml" }}

      - attach_workspace:
          at: .

      - run:
          name: Generate Version
          command: |
            VERSION="1.0.$(git rev-list --count HEAD)"
            echo "Generated version: $VERSION"

      # Build and test the project
      - run:
          name: Build
          command: mvn clean install

      - persist_to_workspace:
          root: .
          paths:
            - target

      - store_artifacts:
          path: ./target

      - run:
          name: Print specific variables
          command: |
            echo "CircleCI Build URL: $CIRCLE_BUILD_URL"
            echo "CircleCI Job Name: $CIRCLE_JOB"
            echo "CircleCI project repo name: $CIRCLE_PROJECT_REPONAME"
            echo "CircleCI username: $CIRCLE_USERNAME"
            echo "CircleCI Branch: $CIRCLE_BRANCH"
            echo "CircleCI build num: $CIRCLE_BUILD_NUM"
            echo "CircleCI ci: $CI"
  test:
    executor: posts-executor
    docker:
      - image: maven:3.8.1-jdk-11
      - image: circleci/mysql

    steps:
      - checkout
      - restore_cache:
          key: jars-{{ checksum "pom.xml" }}
      - run:
          name: Test
          command: mvn test
      - save_cache:
          paths:
            - ~/.m2
          key: jars-{{ checksum "pom.xml" }}

      - store_artifacts:
          path: target/surefire-reports
      - store_test_results:
          path: target/surefire-reports

      - run:
          name: Print specific variables
          command: |
            echo "CircleCI Build URL: $CIRCLE_BUILD_URL"
            echo "CircleCI Job Name: $CIRCLE_JOB"
            echo "CircleCI project repo name: $CIRCLE_PROJECT_REPONAME"
            echo "CircleCI username: $CIRCLE_USERNAME"
            echo "CircleCI Branch: $CIRCLE_BRANCH"
            echo "CircleCI build num: $CIRCLE_BUILD_NUM"
            echo "CircleCI ci: $CI"

  artefact-delivery:
    executor: posts-executor
    docker:
      - image: cimg/base:stable

    steps:
      - checkout

      - attach_workspace:
          at: .

      - add_ssh_keys:
          fingerprints:
            - "SHA256:bdQhUpWvsTenmxgrI/Z4u49QPvaTPhHqZk0SZpzUuQE"
      - run:
          name: Install SSH Client
          command: sudo apt-get update && sudo apt-get install -y openssh-client

      - run:
          name: SSH connection and deploy .war file
          command: |
            scp -v -o StrictHostKeyChecking=no target/post-app.war $SSH_USER@$SSH_HOST:/opt/docker-version/post-app.war
          no_output_timeout: 20m

      - run:
          name: SSH connection and deploy Dockerfile
          command: |
            scp -v -o StrictHostKeyChecking=no docker/Dockerfile $SSH_USER@$SSH_HOST:/opt/docker-version/Dockerfile
          no_output_timeout: 20m

      - run:
          name: SSH connection and deploy docker-compose
          command: |
            scp -v -o StrictHostKeyChecking=no docker/docker-compose.yml $SSH_USER@$SSH_HOST:/opt/docker-version/docker-compose.yml
          no_output_timeout: 20m

      - run:
          name: Print specific variables
          command: |
            echo "CircleCI Build URL: $CIRCLE_BUILD_URL"
            echo "CircleCI Job Name: $CIRCLE_JOB"
            echo "CircleCI project repo name: $CIRCLE_PROJECT_REPONAME"
            echo "CircleCI username: $CIRCLE_USERNAME"
            echo "CircleCI Branch: $CIRCLE_BRANCH"
            echo "CircleCI build num: $CIRCLE_BUILD_NUM"
            echo "CircleCI ci: $CI"

  artefact-deploy:
    executor: posts-executor
    docker:
      - image: cimg/base:stable

    steps:
      - checkout

      - attach_workspace:
          at: .

      - run:
          name: Print specific variables
          command: |
            echo "CircleCI Build URL: $CIRCLE_BUILD_URL"
            echo "CircleCI Job Name: $CIRCLE_JOB"
            echo "CircleCI project repo name: $CIRCLE_PROJECT_REPONAME"
            echo "CircleCI username: $CIRCLE_USERNAME"
            echo "CircleCI Branch: $CIRCLE_BRANCH"
            echo "CircleCI build num: $CIRCLE_BUILD_NUM"
            echo "CircleCI ci: $CI"

      - run:
          name: Build and Run Docker on Server
          command: |
            ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST "
              cd /opt/docker-version &&
              docker build -t post-app:latest . &&
              docker-compose down &&
              docker-compose up -d
            "
  notify:
    executor: posts-executor
    docker:
      - image: circleci/python:3.8
      - image: cimg/base:stable
    steps:
      - run:
          name: Send notification to Telegram
          command: |
            STATUS="{{ circleci.status }}"
            BUILD_URL="{{ circleci.build_url }}"
            BUILD_NUMBER="{{ circleci.build_num }}"
            BRANCH="{{ circleci.branch }}"
            JOB_NAME="{{ circleci.job }}"
            COMMIT_HASH="{{ circleci.sha1 }}"
            CIRCLE_PROJECT_REPONAME = "{{ circleci.project.reponame}}"
            if [ "$STATUS" == "success" ]; then
              MESSAGE="Build #${BUILD_NUMBER} succeeded! ${BUILD_URL}\nRepo name: ${CIRCLE_PROJECT_REPONAME}\nBranch: ${BRANCH}\nCommit: ${COMMIT_HASH}\nJob: ${JOB_NAME}"
            else
              MESSAGE="Build #${BUILD_NUMBER} failed! ${BUILD_URL}\nRepo name: ${CIRCLE_PROJECT_REPONAME}\nBranch: ${BRANCH}\nCommit: ${COMMIT_HASH}\nJob: ${JOB_NAME}"
            fi
            curl -X POST "https://api.telegram.org/bot8160426392:AAH0U-rES-lEvecTZopoaeKKFsB9iF_3OJ8/sendMessage" \
              -d "chat_id=845733750" \
              -d text="${MESSAGE}"

      - run:
          name: Print all environment variables
          command: printenv

workflows:
  version: 2
  build_test_deploy:
    jobs:
      - build
      - test
      - artefact-delivery:
# Ignore deployment if versioning for app didn't present
#          filters:
#            tags:
#              only: /^v.*/
#            branches:
#              ignore: /.*/
          requires:
            - build
            - test
      - artefact-deploy:
          requires:
            - artefact-delivery
      - notify

