version: 2.1

orbs:
  azure-acr: circleci/azure-acr@0.2.0
  docker: circleci/docker@3.2.0
  azure-aks: circleci/azure-aks@0.3.0
  azure-cli: circleci/azure-cli@1.2.2
  helm: circleci/helm@2.0.0
  ms-teams-orb: opub/ms-teams-orb@1.0.3

executors:
  posts-executor:
    environment:
      CONTAINER_IMAGE_NAME: posts/posts
    docker:
      - image: cimg/openjdk:8.0
      - image: cimg/base:2022.09

jobs:
  build:
    executor: posts-executor
    docker:
      - image: maven:3.8.1-jdk-11
      - image: circleci/mysql
      - image: docker:20.10.24

    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - restore_cache:
          key: jars-{{ checksum "pom.xml" }}

      - run: mvn dependency:go-offline

      - save_cache:
          paths:
            - ~/.m2
          key: jars-{{ checksum "pom.xml" }}

      - attach_workspace:
          at: .

      - run:
          name: Generate Version
          command: |
            VERSION="1.0.$(git rev-list --count HEAD)"
            echo "Generated version: $VERSION"

      # Build and test the project
      - run:
          name: Build
          command: mvn clean install

      - persist_to_workspace:
          root: .
          paths:
            - target

      - store_artifacts:
          path: ./target

      - ms-teams-orb/report:
          only_on_fail: false
          webhook_url: $TEAMS_WEBHOOK_URL

  test:
    executor: posts-executor
    docker:
      - image: maven:3.8.1-jdk-11
      - image: circleci/mysql

    steps:
      - checkout
      - restore_cache:
          key: jars-{{ checksum "pom.xml" }}
      - run:
          name: Test
          command: mvn test
      - save_cache:
          paths:
            - ~/.m2
          key: jars-{{ checksum "pom.xml" }}

      - store_artifacts:
          path: target/surefire-reports
      - store_test_results:
          path: target/surefire-reports

      - ms-teams-orb/report:
          only_on_fail: false
          webhook_url: $TEAMS_WEBHOOK_URL

  azure-portal:
    executor: posts-executor
    resource_class: large

    docker:
      - image: cimg/base:2022.09

    environment:
      REGISTRY: slregistry.azurecr.io
      IMAGE_NAME: post

    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - docker/setup-buildx:
          version: latest

      - attach_workspace:
          at: .

      - run:
          name: Generate image tag
          command: |
            export IMAGE_TAG="1.0.0-$(date -u +%Y%m%d.%H%M%S)"
            echo "IMAGE_TAG=$IMAGE_TAG" >> $BASH_ENV
            echo "Generated tag: $IMAGE_TAG"

      - run:
          name: Login to Azure Container Registry
          command: |
            echo $AZURE_ACR_PASSWORD | docker login $AZURE_ACR_SERVER -u $AZURE_ACR_USERNAME --password-stdin

      - run:
          name: Build docker image
          command: |
            docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t $REGISTRY/$IMAGE_NAME:$IMAGE_TAG \
            --push .

#      - run:
#          name: Push docker image
#          command: |
#            docker push $REGISTRY/$IMAGE_NAME:$IMAGE_TAG

      - run:
          name: Update deployment.yaml with new image
          command: |
            sed -i "s|image:.*|image: $REGISTRY/$IMAGE_NAME:$IMAGE_TAG|" k8s/deployment.yaml          

      - run:
          name: Commit updated deployment.yaml
          command: |
            git config --global user.email "circleci@example.com"
            git config --global user.name "CircleCI"
            git add k8s/deployment.yaml
            git commit -am "Update deployment image to $REGISTRY/$IMAGE_NAME:$IMAGE_TAG [skip ci]" || echo "No changes to commit"
            git push origin circleCI

      - persist_to_workspace:
