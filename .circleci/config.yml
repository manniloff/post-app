  notify:
    executor: posts-executor
    docker:
      - image: circleci/python:3.8
      - image: cimg/base:stable
    steps:
      - run:
          name: Send Notification to Telegram
          command: |
            STATUS="$CIRCLE_JOB_STATUS"
            PROJECT="$CIRCLE_PROJECT_REPONAME"
            BRANCH="$CIRCLE_BRANCH"
            USERNAME="$CIRCLE_USERNAME"
            BUILD_NUMBER="$CIRCLE_BUILD_NUM"
            BUILD_URL="$CIRCLE_BUILD_URL"
            WORKFLOW_ID="$CIRCLE_WORKFLOW_ID"

            # Get workflow jobs using CircleCI API
            JOBS=$(curl -s -u "${CIRCLECI_API_TOKEN}:" \
              "https://circleci.com/api/v2/workflow/${WORKFLOW_ID}/job")

            # Extract job statuses using jq
            TEST_JOB_STATUS=$(echo "$JOBS" | jq -r '.items[] | select(.name=="test") | .status')
            BUILD_JOB_STATUS=$(echo "$JOBS" | jq -r '.items[] | select(.name=="build") | .status')
            DELIVERY_JOB_STATUS=$(echo "$JOBS" | jq -r '.items[] | select(.name=="artefact-delivery") | .status')
            DEPLOY_JOB_STATUS=$(echo "$JOBS" | jq -r '.items[] | select(.name=="artefact-deploy") | .status')

            # Determine workflow status
            if [[ "$TEST_JOB_STATUS" == "success" && \
                  "$BUILD_JOB_STATUS" == "success" && \
                  "$DELIVERY_JOB_STATUS" == "success" && \
                  "$DEPLOY_JOB_STATUS" == "success" ]]; then
              WORKFLOW_STATUS="✅"
            else
              WORKFLOW_STATUS="❌"
            fi

            # Helper function to map statuses to emojis
            function get_status_emoji() {
              local status=$1
              if [[ "$status" == "success" ]]; then
                echo "✅"
              elif [[ "$status" == "failed" ]]; then
                echo "❌"
              elif [[ "$status" == "running" ]]; then
                echo "🔄"
              else
                echo "❔"
              fi
            }

            # Extract job statuses with emojis
            TEST_JOB_STATUS=$(echo "$JOBS" | jq -r '.items[] | select(.name=="test") | .status')
            TEST_JOB_STATUS_EMOJI=$(get_status_emoji "$TEST_JOB_STATUS")

            BUILD_JOB_STATUS=$(echo "$JOBS" | jq -r '.items[] | select(.name=="build") | .status')
            BUILD_JOB_STATUS_EMOJI=$(get_status_emoji "$BUILD_JOB_STATUS")

            DELIVERY_JOB_STATUS=$(echo "$JOBS" | jq -r '.items[] | select(.name=="artefact-delivery") | .status')
            DELIVERY_JOB_STATUS_EMOJI=$(get_status_emoji "$DELIVERY_JOB_STATUS")

            DEPLOY_JOB_STATUS=$(echo "$JOBS" | jq -r '.items[] | select(.name=="artefact-deploy") | .status')
            DEPLOY_JOB_STATUS_EMOJI=$(get_status_emoji "$DEPLOY_JOB_STATUS")

            # Construct the message
            # MESSAGE="*Project:* $PROJECT\n*Branch:* $BRANCH\n*Build Number:* $BUILD_NUMBER\n*Build URL:* $BUILD_URL\n*Workflow Status:* $WORKFLOW_STATUS\n\n*Jobs:*\n- *test:* $TEST_JOB_STATUS\n- *build:* $BUILD_JOB_STATUS\n- *artefact_delivery:* $DELIVERY_JOB_STATUS\n- *artefact_deploy:* $DEPLOY_JOB_STATUS"

            # Construct the notification message using printf
            MESSAGE=$(printf "*Project:* %s\n*Branch:* %s\n*Build Number:* %s\n*Build URL:* %s\n*Workflow Status:* *%s*\n\n*Jobs:*\n  *- Test:* %s\n  *- Build:* %s\n  *- Artefact Delivery:* %s\n  *- Artefact Deploy:* %s" \
                   "$PROJECT" "$BRANCH" "$BUILD_NUMBER" "$BUILD_URL" "$WORKFLOW_STATUS" \
                   "$TEST_JOB_STATUS_EMOJI" \
                   "$BUILD_JOB_STATUS_EMOJI" \
                   "$DELIVERY_JOB_STATUS_EMOJI" \
                   "$DEPLOY_JOB_STATUS_EMOJI")

            # Send the message to Telegram
             curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
             -d chat_id="${TELEGRAM_CHAT_ID}" \
             -d text="${MESSAGE}" \
             -d parse_mode="Markdown"

